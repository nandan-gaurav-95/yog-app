<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="12" fill="#ffffff"/>
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e87010"/>
      <stop offset="100%" stop-color="#8b4400"/>
    </linearGradient>
  </defs>
  <!-- C arc — stays within circle boundary -->
  <path d="M62,16 A34,34 0 1,0 62,84"
    fill="none" stroke="url(#og)" stroke-width="9" stroke-linecap="round"/>
  <!-- D vertical bar -->
  <rect x="44" y="28" width="7" height="44" rx="1" fill="url(#og)"/>
  <!-- D curve -->
  <path d="M51,28 Q74,28 74,50 Q74,72 51,72"
    fill="none" stroke="url(#og)" stroke-width="8" stroke-linecap="butt"/>
  <!-- gap between C and D -->
  <rect x="40" y="36" width="7" height="28" fill="#ffffff"/>
</svg>
